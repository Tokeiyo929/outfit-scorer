name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"

      - name: Build device app (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          if xcodebuild -project OutfitScorer.xcodeproj -scheme OutfitScorer \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-device.log | tail -60; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-device.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build-device.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP=ios/build/Build/Products/Release-iphoneos/OutfitScorer.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr OutfitScorer.ipa Payload
          rm -rf Payload
          ls -lh OutfitScorer.ipa

      - name: Build simulator app
        working-directory: ios
        run: |
          set -o pipefail
          if xcodebuild -project OutfitScorer.xcodeproj -scheme OutfitScorer \
            -configuration Debug -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-sim.log | tail -40; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-sim.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Launch on simulator and screenshot
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/OutfitScorer.app
          xcrun simctl launch "$UDID" com.tokeiyo929.outfitscorer
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke-screenshot.png || true
          ls -lh smoke-screenshot.png || true

      - name: Upload IPA and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: OutfitScorer-unsigned-ipa
          path: |
            OutfitScorer.ipa
            smoke-screenshot.png
          if-no-files-found: error
