<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>穿搭颜色打分</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #2b2a28;
    --sub: #8a867e;
    --accent: #e8613c;
    --accent-soft: #fbeae4;
    --line: #eceae4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 440px; margin: 0 auto; }
  header { text-align: center; padding: 10px 0 16px; }
  header h1 { font-size: 21px; letter-spacing: 2px; }
  header p { font-size: 12.5px; color: var(--sub); margin-top: 5px; letter-spacing: 1px; }
  .card {
    background: var(--card); border-radius: 18px; padding: 16px;
    box-shadow: 0 1px 3px rgba(60,50,30,.05); margin-bottom: 14px;
  }
  .picker { display: flex; gap: 10px; }
  .btn {
    flex: 1; border: none; border-radius: 14px; padding: 14px 0;
    font-size: 15.5px; font-weight: 600; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-main { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--accent-soft); color: var(--accent); }
  .btn:active { opacity: .85; }
  input[type=file] { display: none; }

  .preview-box { position: relative; margin-top: 14px; display: none; }
  .preview-box img { width: 100%; display: block; border-radius: 12px; }
  .cut-line {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 2px dashed rgba(255,255,255,.95);
    box-shadow: 0 0 6px rgba(0,0,0,.45);
  }
  .cut-line::before {
    content: "上衣"; position: absolute; right: 6px; top: -22px;
    font-size: 11px; color: #fff; background: rgba(0,0,0,.45);
    padding: 2px 7px; border-radius: 8px;
  }
  .cut-line::after {
    content: "裤子"; position: absolute; right: 6px; top: 6px;
    font-size: 11px; color: #fff; background: rgba(0,0,0,.45);
    padding: 2px 7px; border-radius: 8px;
  }
  .cut-hint { text-align: center; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .btn-analyze {
    width: 100%; margin-top: 10px; background: var(--ink); color: #fff;
  }
  .crop-box { margin-top: 14px; }
  .crop-box canvas { width: 100%; display: block; border-radius: 12px; background: #1c1b19; touch-action: none; cursor: grab; }
  .crop-hint { text-align: center; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .zoom-slider { width: 100%; accent-color: var(--accent); margin: 8px 0 0; display: block; }

  .result { display: none; }
  .swatches { display: flex; gap: 12px; }
  .swatch {
    flex: 1; border-radius: 14px; padding: 12px; color: #fff;
    min-height: 86px; display: flex; flex-direction: column; justify-content: flex-end;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .swatch .role { font-size: 12px; opacity: .9; }
  .swatch .name { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .swatch .hex { font-size: 11px; opacity: .75; font-family: monospace; margin-top: 1px; }
  .score-row { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  .ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .ring .num b { font-size: 27px; line-height: 1; }
  .ring .num span { font-size: 10.5px; color: var(--sub); margin-top: 3px; }
  .verdict { flex: 1; min-width: 0; }
  .verdict input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .slider-marks { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--sub); margin-top: 2px; }
  .pick-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .pick-hint { font-size: 12px; color: var(--sub); flex: 1; line-height: 1.4; }
  .pick-chip {
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 16px; padding: 6px 14px; font-size: 13px; font-weight: 600;
    flex-shrink: 0;
  }
  .pick-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .pick-dot {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid #fff; box-shadow: 0 0 5px rgba(0,0,0,.5);
    transform: translate(-50%, -50%); pointer-events: none; display: none;
  }
  .pick-dot::after {
    content: attr(data-label); position: absolute; top: -17px; left: 50%;
    transform: translateX(-50%); font-size: 10px; color: #fff;
    background: rgba(0,0,0,.5); padding: 1px 6px; border-radius: 6px; white-space: nowrap;
  }
  .comment-input {
    width: 100%; margin-top: 14px; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 13.5px; font-family: inherit; color: var(--ink);
    background: #fbfaf7; resize: none; min-height: 64px; line-height: 1.55;
    display: block;
  }
  .comment-input:focus { outline: none; border-color: var(--accent); }
  .comment-input::placeholder { color: #b5b0a6; }
  .warn { background: #fdf3d7; color: #8a6d1a; border-radius: 12px; padding: 10px 13px; font-size: 12.5px; margin-top: 10px; line-height: 1.55; display: none; }
  .btn-again { width: 100%; margin-top: 14px; background: var(--accent-soft); color: var(--accent); }
  .btn-save { width: 100%; margin-top: 10px; background: #3f9d63; color: #fff; }
  .btn-save[disabled] { opacity: .55; }
  .history h2 { font-size: 15px; letter-spacing: 1px; padding: 2px 2px 10px; }
  .h-item { display: flex; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .h-item:last-child { border-bottom: none; }
  .h-item img { width: 52px; height: 68px; object-fit: cover; border-radius: 9px; background: #eee; flex-shrink: 0; cursor: pointer; }
  .h-info { flex: 1; min-width: 0; }
  .h-info .line1 { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .h-dot { width: 13px; height: 13px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.08); flex-shrink: 0; }
  .h-info .line2 { font-size: 11.5px; color: var(--sub); margin-top: 3px; line-height: 1.5; }
  .h-score { font-size: 19px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .h-del { border: none; background: none; color: #c9c4ba; font-size: 17px; padding: 6px 2px 6px 8px; flex-shrink: 0; }
  .h-empty { text-align: center; color: var(--sub); font-size: 12.5px; padding: 14px 0; }
  .foot { text-align: center; font-size: 11px; color: #b5b0a6; margin-top: 18px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>穿搭颜色打分</h1>
    <p>拍一张全身照 · 识别颜色 · 自己打分写点评</p>
  </header>

  <div class="card">
    <div class="picker">
      <button class="btn btn-main" id="btnCamera">📷 拍照</button>
      <button class="btn btn-ghost" id="btnAlbum">🖼 相册选择</button>
    </div>
    <input type="file" id="fileCamera" accept="image/*" capture="environment">
    <input type="file" id="fileAlbum" accept="image/*">

    <div class="crop-box" id="cropBox" style="display:none">
      <canvas id="cropCanvas"></canvas>
      <div class="crop-hint">拖动照片调整位置 · 滑块放大缩小 · 把人框满画面</div>
      <input type="range" id="zoomSlider" class="zoom-slider" min="0" max="100" step="1" value="0">
      <button class="btn btn-analyze" id="btnCropDone">✂️ 完成裁剪</button>
    </div>

    <div class="preview-box" id="previewBox">
      <img id="preview" alt="预览">
      <div class="cut-line" id="cutLine" style="top:52%"></div>
      <div class="pick-dot" id="dotTop" data-label="上衣"></div>
      <div class="pick-dot" id="dotBottom" data-label="裤子"></div>
    </div>
    <div class="cut-hint" id="cutHint" style="display:none">拖动虚线调整上衣 / 裤子分界</div>
    <button class="btn btn-analyze" id="btnAnalyze" style="display:none">识别颜色</button>
  </div>

  <div class="card result" id="resultCard">
    <div class="swatches">
      <div class="swatch" id="swTop"><span class="role">上衣</span><span class="name">—</span><span class="hex"></span></div>
      <div class="swatch" id="swBottom"><span class="role">裤子</span><span class="name">—</span><span class="hex"></span></div>
    </div>
    <div class="pick-row">
      <span class="pick-hint">颜色不对？选中后在照片上点一下位置取色</span>
      <button class="pick-chip active" id="pickTop">上衣</button>
      <button class="pick-chip" id="pickBottom">裤子</button>
    </div>
    <div class="score-row">
      <div class="ring">
        <svg width="92" height="92">
          <circle cx="46" cy="46" r="40" fill="none" stroke="#efece6" stroke-width="9"/>
          <circle id="ringBar" cx="46" cy="46" r="40" fill="none" stroke="#e8613c" stroke-width="9"
                  stroke-linecap="round" stroke-dasharray="0 251.3"/>
        </svg>
        <div class="num"><b id="scoreNum">70</b><span>我的评分</span></div>
      </div>
      <div class="verdict">
        <input type="range" id="scoreSlider" min="0" max="100" step="1" value="70">
        <div class="slider-marks"><span>0</span><span>50</span><span>100</span></div>
      </div>
    </div>
    <div class="warn" id="warn"></div>
    <textarea class="comment-input" id="commentInput" placeholder="写点点评（可选）：这身穿着感觉怎么样"></textarea>
    <button class="btn btn-again" id="btnAgain">重新识别</button>
    <button class="btn btn-save" id="btnSave" style="display:none">💾 保存记录</button>
  </div>

  <div class="card history" id="historyCard">
    <h2>📋 保存的记录</h2>
    <div id="historyList"><div class="h-empty">加载中…</div></div>
  </div>

  <div class="foot">识别纯本地 · 仅点「保存」才上传照片</div>
</div>

<script>
"use strict";

/* ---------------- 工具 ---------------- */
const $ = id => document.getElementById(id);

function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    switch (mx) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4;
    }
    h *= 60;
  }
  return [h, s, l];
}
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    switch (mx) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4;
    }
    h *= 60;
  }
  return [h, mx ? d / mx : 0, mx];
}
function hslStr(h, s, l) { return `hsl(${h.toFixed(0)},${(s * 100).toFixed(0)}%,${(l * 100).toFixed(0)}%)`; }
function hsl2rgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x]; else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255].map(v => Math.round(v));
}
function hsl2hex(h, s, l) {
  return "#" + hsl2rgb(h, s, l).map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase();
}

/* 近似中文色名 */
function colorName(h, s, l) {
  /* 近白暖色（奶油/米白）饱和度能到 0.2+，不抬阈值会被当成棕色系 */
  if (s < 0.10 || (s < 0.15 && l >= 0.70) || (s < 0.22 && l >= 0.82)) {
    if (l < 0.18) return "黑色";
    if (l < 0.42) return "深灰";
    if (l < 0.66) return "灰色";
    if (l < 0.88) return "浅灰";
    return (h >= 20 && h <= 70) ? "米白" : "白色";
  }
  /* 蓝黄两族按明度细分：光靠饱和度分档，深蓝会漏成宝蓝、姜黄会漏成黄色 */
  if (h >= 38 && h < 62 && s < 0.5 && l >= 0.8) return "浅黄";
  if (h >= 195 && h < 255 && s >= 0.2 && l < 0.32) return "藏青";
  if (h >= 195 && h < 245 && s >= 0.25 && s < 0.6 && l >= 0.32 && l < 0.62) return "牛仔蓝";
  /* 驼/卡其/深咖按明度分档：黄棕带光靠饱和度分，中明度暖色会漏成姜黄 */
  if (h >= 12 && h < 38 && s >= 0.30 && l < 0.35) return "深咖";
  if (h >= 30 && h < 58 && s >= 0.20 && s < 0.50 && l >= 0.45 && l < 0.75) return l >= 0.62 ? "卡其" : "驼色";
  const hueNames = [
    [12,  [[0.35,"酒红"],[0.55,"砖红"],[9,"正红"]], "红"],
    [38,  [[0.3,"深咖"],[0.45,"驼色"],[0.6,"卡其"]], "棕"],
    [62,  [[0.7,"姜黄"],[1,"黄色"]], "黄"],
    [95,  [[0.35,"橄榄绿"],[0.55,"草绿"],[1,"绿色"]], "绿"],
    [150, [[0.3,"墨绿"],[0.55,"湖绿"],[1,"青绿"]], "绿"],
    [195, [[0.3,"墨绿"],[0.55,"湖绿"],[1,"青绿"]], "青"],
    [250, [[0.3,"藏青"],[0.55,"宝蓝"],[1,"蓝色"]], "蓝"],
    [285, [[0.35,"香芋紫"],[0.6,"紫色"]], "紫"],
    [315, [[0.35,"紫红"],[0.6,"玫红"]], "紫红"],
    [346, [[0.5,"粉色"],[1,"玫粉"]], "粉"],
  ];
  for (const [maxH, stops, fallback] of hueNames) {
    if (h < maxH) {
      for (const [maxS, name] of stops) if (s < maxS) return name;
      return fallback;
    }
  }
  return "玫粉";
}

/* ---------------- 识别 ---------------- */
/* 肤色判定走 HSV：正红/砖红/卡其衣料也在暖色相区，靠色相≤40°+饱和度上限挡在外面 */
function isSkin(h, s, v) {
  return (h >= 5 && h <= 40) && s >= 0.10 && s <= 0.68 && v >= 0.35;
}
function colorDist(a, b) {
  const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
  return Math.sqrt(dr * dr + dg * dg + db * db);
}

function analyzeImage(img, boundary) {
  const MAXW = 260;
  const scale = Math.min(1, MAXW / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const hgt = Math.max(1, Math.round(img.naturalHeight * scale));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = hgt;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.drawImage(img, 0, 0, w, hgt);
  const data = cx.getImageData(0, 0, w, hgt).data;

  const px = (x, y) => {
    const i = (y * w + x) * 4;
    return [data[i], data[i + 1], data[i + 2]];
  };

  /* 背景色：边缘 4px 框的主色（最亮簇均值） */
  const border = [];
  for (let x = 0; x < w; x++) {
    for (const y of [0, 1, 2, 3, hgt - 4, hgt - 3, hgt - 2, hgt - 1]) border.push(px(x, y));
  }
  for (let y = 0; y < hgt; y++) {
    for (const x of [0, 1, 2, 3, w - 4, w - 3, w - 2, w - 1]) border.push(px(x, y));
  }
  const bgBins = {};
  for (const p of border) {
    const key = `${p[0] >> 5}_${p[1] >> 5}_${p[2] >> 5}`;
    (bgBins[key] = bgBins[key] || []).push(p);
  }
  const bgKey = Object.keys(bgBins).sort((a, b) => bgBins[b].length - bgBins[a].length)[0];
  const bgAvg = [0, 1, 2].map(c => Math.round(bgBins[bgKey].reduce((s, p) => s + p[c], 0) / bgBins[bgKey].length));

  function regionColor(y0, y1, bgThresh) {
    const bins = {};
    let total = 0;
    for (let y = Math.floor(hgt * y0); y < Math.floor(hgt * y1); y++) {
      for (let x = Math.floor(w * 0.24); x < Math.floor(w * 0.76); x++) {
        const p = px(x, y);
        const [hh, ss, vv] = rgb2hsv(p[0], p[1], p[2]);
        total++;
        if (colorDist(p, bgAvg) < bgThresh) continue;
        if (isSkin(hh, ss, vv)) continue;
        const key = `${Math.floor(hh / 20)}_${Math.floor(ss * 4)}_${Math.floor(vv * 4)}`;
        (bins[key] = bins[key] || []).push(p);
      }
    }
    const keys = Object.keys(bins).sort((a, b) => bins[b].length - bins[a].length);
    if (!keys.length) return { color: [128, 128, 128], coverage: 0 };
    const best = bins[keys[0]];
    const avg = [0, 1, 2].map(c => Math.round(best.reduce((s, p) => s + p[c], 0) / best.length));
    return { color: avg, coverage: best.length / Math.max(1, total) };
  }

  let top = regionColor(0.22, Math.max(0.3, boundary - 0.04), 46);
  let bottom = regionColor(Math.min(0.9, boundary + 0.04), 0.88, 46);
  /* 浅色衣料可能贴着浅背景（RGB 距离小于背景阈值），首轮全被当背景时放宽重试 */
  if (top.coverage < 0.05) top = regionColor(0.22, Math.max(0.3, boundary - 0.04), 18);
  if (bottom.coverage < 0.05) bottom = regionColor(Math.min(0.9, boundary + 0.04), 0.88, 18);
  return { top, bottom, bgAvg };
}

/* ---------------- 界面流程 ---------------- */
let boundary = 0.52;
let loadedImg = null;
/* 颜色与取色状态：topHSL/bottomHSL 是最终颜色（自动识别或手动取色） */
let topHSL = null, bottomHSL = null;
let topPos = null, bottomPos = null;   /* 手动取色点（图片比例坐标 0~1） */
let pickMode = "top";                  /* 下一次点击取给谁 */
let analyzed = false;
let myScore = 70;
let sampleCv = null;                   /* 取色用降采样画布 */

function buildSampleCanvas(img) {
  const MAXW = 260;
  const scale = Math.min(1, MAXW / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const hgt = Math.max(1, Math.round(img.naturalHeight * scale));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = hgt;
  cv.getContext("2d").drawImage(img, 0, 0, w, hgt);
  return cv;
}

function showPreview(img) {
  loadedImg = img;
  sampleCv = buildSampleCanvas(img);
  $("preview").src = img.src;
  $("cropBox").style.display = "none";
  $("previewBox").style.display = "block";
  $("cutHint").style.display = "block";
  $("btnAnalyze").style.display = "flex";
  $("resultCard").style.display = "none";
  analyzed = false;
  topPos = bottomPos = null;
  $("dotTop").style.display = $("dotBottom").style.display = "none";
  moveCutLine();
}
function moveCutLine() {
  const box = $("previewBox");
  const img = $("preview");
  const top = img.offsetTop + img.clientHeight * boundary;
  $("cutLine").style.top = top + "px";
}

function handleFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { sourceImg = img; enterCrop(); };
  img.onerror = () => alert("图片读取失败，换一张试试");
  img.src = url;
}

/* ---------------- 裁剪 ---------------- */
let sourceImg = null;   /* 原始照片，「重新识别」回到这里重新框 */
const cropView = { scale: 1, ox: 0, oy: 0 };
let cropCover = 1, cropContain = 1, cropW = 0, cropH = 0;
window.__crop = cropView; /* 测试钩子 */

function enterCrop() {
  $("cropBox").style.display = "block";
  $("previewBox").style.display = "none";
  $("cutHint").style.display = "none";
  $("btnAnalyze").style.display = "none";
  $("resultCard").style.display = "none";
  $("dotTop").style.display = $("dotBottom").style.display = "none";
  analyzed = false;
  topPos = bottomPos = null;
  initCropView();
}
function initCropView() {
  const box = $("cropBox");
  const cv = $("cropCanvas");
  cropW = box.clientWidth;
  cropH = Math.round(cropW * 1.25);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(cropW * dpr);
  cv.height = Math.round(cropH * dpr);
  cv.style.height = cropH + "px";
  const srcW = sourceImg.naturalWidth, srcH = sourceImg.naturalHeight;
  cropContain = Math.min(cropW / srcW, cropH / srcH);
  cropCover = Math.max(cropW / srcW, cropH / srcH);
  cropView.scale = cropContain;
  cropView.ox = (cropW - srcW * cropContain) / 2;
  cropView.oy = (cropH - srcH * cropContain) / 2;
  $("zoomSlider").value = 0;
  drawCrop();
}
function cropClamp() {
  const drawnW = sourceImg.naturalWidth * cropView.scale;
  const drawnH = sourceImg.naturalHeight * cropView.scale;
  cropView.ox = drawnW <= cropW ? (cropW - drawnW) / 2
    : Math.min(0, Math.max(cropW - drawnW, cropView.ox));
  cropView.oy = drawnH <= cropH ? (cropH - drawnH) / 2
    : Math.min(0, Math.max(cropH - drawnH, cropView.oy));
}
function drawCrop() {
  const cv = $("cropCanvas");
  const cx = cv.getContext("2d");
  const dpr = cv.width / cropW;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.fillStyle = "#1c1b19";
  cx.fillRect(0, 0, cropW, cropH);
  cx.drawImage(sourceImg, cropView.ox, cropView.oy,
    sourceImg.naturalWidth * cropView.scale, sourceImg.naturalHeight * cropView.scale);
}
$("zoomSlider").addEventListener("input", () => {
  const v = Number($("zoomSlider").value) / 100;
  const min = cropContain, max = cropCover * 4;
  const old = cropView.scale;
  const cxPt = (cropW / 2 - cropView.ox) / old;   /* 视口中心的源坐标 */
  const cyPt = (cropH / 2 - cropView.oy) / old;
  cropView.scale = min * Math.pow(max / min, v);
  cropView.ox = cropW / 2 - cxPt * cropView.scale;
  cropView.oy = cropH / 2 - cyPt * cropView.scale;
  cropClamp();
  drawCrop();
});
(() => {
  const cv = $("cropCanvas");
  let panning = false, px = 0, py = 0;
  cv.addEventListener("pointerdown", e => {
    panning = true; px = e.clientX; py = e.clientY; e.preventDefault();
  });
  window.addEventListener("pointermove", e => {
    if (!panning) return;
    cropView.ox += e.clientX - px;
    cropView.oy += e.clientY - py;
    px = e.clientX; py = e.clientY;
    cropClamp();
    drawCrop();
  });
  window.addEventListener("pointerup", () => { panning = false; });
})();
$("btnCropDone").onclick = () => {
  const s = cropView.scale;
  /* 视口与照片可见区域的交集 → 源图坐标 */
  const vx0 = Math.max(0, cropView.ox), vy0 = Math.max(0, cropView.oy);
  const vx1 = Math.min(cropW, cropView.ox + sourceImg.naturalWidth * s);
  const vy1 = Math.min(cropH, cropView.oy + sourceImg.naturalHeight * s);
  const sx = (vx0 - cropView.ox) / s, sy = (vy0 - cropView.oy) / s;
  const sw = (vx1 - vx0) / s, sh = (vy1 - vy0) / s;
  const outScale = Math.min(1, 1600 / Math.max(sw, sh));
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(sw * outScale));
  cv.height = Math.max(1, Math.round(sh * outScale));
  cv.getContext("2d").drawImage(sourceImg, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  const img = new Image();
  img.onload = () => showPreview(img);
  img.src = cv.toDataURL("image/jpeg", 0.92);
};
$("btnCamera").onclick = () => $("fileCamera").click();
$("btnAlbum").onclick = () => $("fileAlbum").click();
$("fileCamera").onchange = e => handleFile(e.target.files[0]);
$("fileAlbum").onchange = e => handleFile(e.target.files[0]);

/* 识别前：拖动分界线；识别后：点击照片取色 */
(() => {
  const box = $("previewBox");
  let dragging = false;
  const setFromEvent = e => {
    const img = $("preview");
    const rect = img.getBoundingClientRect();
    let f = (e.clientY - rect.top) / rect.height;
    f = Math.max(0.35, Math.min(0.7, f));
    boundary = f;
    moveCutLine();
  };
  box.addEventListener("pointerdown", e => {
    if (analyzed) { pickColorAt(e); e.preventDefault(); return; }
    dragging = true; setFromEvent(e); e.preventDefault();
  });
  window.addEventListener("pointermove", e => { if (dragging) setFromEvent(e); });
  window.addEventListener("pointerup", () => { dragging = false; });
})();

/* 在照片上点一下取色：7x7 小块取平均，容忍压缩噪点 */
function pickColorAt(e) {
  const img = $("preview");
  const rect = img.getBoundingClientRect();
  const fx = (e.clientX - rect.left) / rect.width;
  const fy = (e.clientY - rect.top) / rect.height;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1 || !sampleCv) return;
  const R = 3;
  const x = Math.round(fx * sampleCv.width), y = Math.round(fy * sampleCv.height);
  const x0 = Math.max(0, x - R), y0 = Math.max(0, y - R);
  const x1 = Math.min(sampleCv.width - 1, x + R), y1 = Math.min(sampleCv.height - 1, y + R);
  const d = sampleCv.getContext("2d").getImageData(x0, y0, x1 - x0 + 1, y1 - y0 + 1).data;
  const acc = [0, 0, 0];
  for (let i = 0; i < d.length; i += 4) { acc[0] += d[i]; acc[1] += d[i + 1]; acc[2] += d[i + 2]; }
  const color = acc.map(v => Math.round(v / (d.length / 4)));
  const hsl = rgb2hsl(...color);
  const pos = { x: fx, y: fy };
  if (pickMode === "top") { topHSL = hsl; topPos = pos; pickMode = "bottom"; }
  else { bottomHSL = hsl; bottomPos = pos; pickMode = "top"; }
  renderColors();
  renderDots();
  renderPickChips();
}

function renderColors() {
  $("swTop").style.background = hslStr(...topHSL);
  $("swTop").querySelector(".name").textContent = colorName(...topHSL);
  $("swTop").querySelector(".hex").textContent = hsl2hex(...topHSL);
  $("swBottom").style.background = hslStr(...bottomHSL);
  $("swBottom").querySelector(".name").textContent = colorName(...bottomHSL);
  $("swBottom").querySelector(".hex").textContent = hsl2hex(...bottomHSL);
}
function renderDots() {
  const img = $("preview");
  [["dotTop", topPos, topHSL, "上衣"], ["dotBottom", bottomPos, bottomHSL, "裤子"]].forEach(([id, pos, hsl, label]) => {
    const el = $(id);
    if (!pos) { el.style.display = "none"; return; }
    el.style.display = "block";
    el.style.left = img.offsetLeft + img.clientWidth * pos.x + "px";
    el.style.top = img.offsetTop + img.clientHeight * pos.y + "px";
    el.style.background = hslStr(...hsl);
    el.dataset.label = label;
  });
}
function renderPickChips() {
  $("pickTop").classList.toggle("active", pickMode === "top");
  $("pickBottom").classList.toggle("active", pickMode === "bottom");
}
$("pickTop").onclick = () => { pickMode = "top"; renderPickChips(); };
$("pickBottom").onclick = () => { pickMode = "bottom"; renderPickChips(); };

function updateScore() {
  myScore = Number($("scoreSlider").value);
  $("scoreNum").textContent = myScore;
  const C = 2 * Math.PI * 40;
  $("ringBar").style.strokeDasharray = `${(myScore / 100) * C} ${C}`;
}
$("scoreSlider").addEventListener("input", updateScore);

$("btnAnalyze").onclick = () => {
  if (!loadedImg) return;
  const r = analyzeImage(loadedImg, boundary);
  topHSL = rgb2hsl(...r.top.color);
  bottomHSL = rgb2hsl(...r.bottom.color);
  topPos = bottomPos = null;
  renderColors();
  renderDots();

  const warn = $("warn");
  const lowTop = r.top.coverage < 0.05, lowBottom = r.bottom.coverage < 0.05;
  if (lowTop || lowBottom) {
    warn.style.display = "block";
    warn.textContent = "⚠ " + (lowTop ? "上衣" : "裤子") +
      "区域自动识别不太确定，建议在照片上点击取色修正。";
  } else warn.style.display = "none";

  $("commentInput").value = "";
  $("scoreSlider").value = 70;
  updateScore();
  pickMode = "top";
  renderPickChips();

  const saveBtn = $("btnSave");
  saveBtn.style.display = "flex";
  saveBtn.disabled = false;
  saveBtn.textContent = "💾 保存记录";

  analyzed = true;
  $("resultCard").style.display = "block";
  $("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
};
$("btnAgain").onclick = () => {
  if (sourceImg) { enterCrop(); return; }   /* 回到裁剪界面重新框 */
  $("resultCard").style.display = "none";
  $("previewBox").style.display = "none";
  $("cutHint").style.display = "none";
  $("btnAnalyze").style.display = "none";
  $("dotTop").style.display = $("dotBottom").style.display = "none";
  loadedImg = null;
  analyzed = false;
  topPos = bottomPos = null;
};
window.addEventListener("resize", () => {
  if (!loadedImg) return;
  moveCutLine();
  renderDots();
});

/* ---------------- 保存记录 / 历史记录 ---------------- */
const API_BASE = "https://outfit-worker.keiyokaze.workers.dev";

$("btnSave").onclick = async () => {
  if (!loadedImg || !topHSL) return;
  const btn = $("btnSave");
  btn.disabled = true;
  btn.textContent = "保存中…";
  try {
    /* 上传前压缩：最长边 1280、质量 0.72，一般 <400KB */
    const scale = Math.min(1, 1280 / Math.max(loadedImg.naturalWidth, loadedImg.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(loadedImg.naturalWidth * scale);
    cv.height = Math.round(loadedImg.naturalHeight * scale);
    cv.getContext("2d").drawImage(loadedImg, 0, 0, cv.width, cv.height);
    const record = {
      top: { name: colorName(...topHSL), hex: hsl2hex(...topHSL), hsl: hslStr(...topHSL) },
      bottom: { name: colorName(...bottomHSL), hex: hsl2hex(...bottomHSL), hsl: hslStr(...bottomHSL) },
      boundary, score: myScore,
      comment: $("commentInput").value.trim(),
    };
    const body = JSON.stringify({ photo: cv.toDataURL("image/jpeg", 0.72), record });
    const res = await fetch(API_BASE + "/api/records", { method: "POST", headers: { "Content-Type": "application/json" }, body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.status);
    btn.textContent = "✅ 已保存";
    loadHistory();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "保存失败，点重试";
  }
};

async function loadHistory() {
  const list = $("historyList");
  try {
    const res = await fetch(API_BASE + "/api/records?limit=30");
    const data = await res.json();
    list.innerHTML = "";
    if (!data.records || !data.records.length) {
      list.innerHTML = '<div class="h-empty">还没有记录，识别后点「保存记录」</div>';
      return;
    }
    data.records.forEach(rec => list.appendChild(historyItem(rec)));
  } catch (e) {
    list.innerHTML = '<div class="h-empty">记录加载失败，检查网络后刷新</div>';
  }
}

function historyItem(rec) {
  const row = document.createElement("div");
  row.className = "h-item";
  if (rec.photo_url) {
    const img = document.createElement("img");
    img.src = rec.photo_url;
    img.loading = "lazy";
    img.alt = "";
    img.onclick = () => window.open(rec.photo_url, "_blank");
    row.appendChild(img);
  }
  const info = document.createElement("div");
  info.className = "h-info";
  const line1 = document.createElement("div");
  line1.className = "line1";
  const dotT = document.createElement("span"); dotT.className = "h-dot"; dotT.style.background = rec.top.hex || "#ccc";
  const dotB = document.createElement("span"); dotB.className = "h-dot"; dotB.style.background = rec.bottom.hex || "#ccc";
  const nameT = document.createElement("span"); nameT.textContent = rec.top.name;
  const nameB = document.createElement("span"); nameB.textContent = rec.bottom.name;
  line1.append(dotT, nameT, document.createTextNode("×"), dotB, nameB);
  const line2 = document.createElement("div");
  line2.className = "line2";
  const d = new Date(rec.created_at);
  line2.textContent = `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  info.append(line1, line2);
  if (rec.comment) {
    const line3 = document.createElement("div");
    line3.className = "line2";
    line3.textContent = "💬 " + rec.comment;
    info.append(line3);
  }
  const score = document.createElement("div");
  score.className = "h-score";
  score.textContent = rec.score;
  const del = document.createElement("button");
  del.className = "h-del";
  del.textContent = "✕";
  del.onclick = async () => {
    if (!confirm("删除这条记录和照片？")) return;
    del.disabled = true;
    try {
      await fetch(API_BASE + "/api/records/" + rec.id, { method: "DELETE" });
      row.remove();
    } catch (e) {
      del.disabled = false;
    }
  };
  row.append(info, score, del);
  return row;
}

loadHistory();
</script>
