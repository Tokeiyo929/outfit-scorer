name: OutfitScorer
options:
  bundleIdPrefix: com.tokeiyo929
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  OutfitScorer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokeiyo929.outfitscorer
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 穿搭打分
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 用于获取你所在城市的实时天气，推荐合适穿搭
        NSCameraUsageDescription: 拍摄穿搭照片用于取色识别
        NSPhotoLibraryUsageDescription: 从相册选择穿搭照片
        ITSAppUsesNonExemptEncryption: false
schemes:
  OutfitScorer:
    build:
      targets:
        OutfitScorer: all
    run:
      config: Debug
    archive:
      config: Release
